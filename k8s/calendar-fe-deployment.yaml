apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-fe
  namespace: calendar
  labels:
    app: calendar-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-fe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: calendar-fe
    spec:
      containers:
        - name: calendar-fe
          image:  calendar-fe:1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
