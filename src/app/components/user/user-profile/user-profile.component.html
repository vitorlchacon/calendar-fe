<div class="user-profile-container">
  <p-card class="profile-card" *ngIf="user">
    <ng-template pTemplate="header">
      <div class="header-content">
        <p-avatar 
          
          size="xlarge" 
          shape="square"
          class="profile-avatar"
        >
          <img [src]="user.profilePhoto || '../../../../assets/img/user_thumb.jpeg'" alt="">
        </p-avatar>
        <div class="header-text">
          <h1>{{ user.fullName }}</h1>
          <div class="verification-status">
            <span class="email-status">
              {{ user.email }}
              <i *ngIf="user.emailVerified" class="pi pi-check-circle verified-icon"></i>
            </span>
            <p-tag 
              [value]="role" 
              severity="info" 
              *ngFor="let role of user.roles"
              class="role-tag"
            ></p-tag>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="profile-content">
      <div class="grid">
        <div class="col-4">
          <p-panel header="Basic Information">
            <div class="info-item">
              <label>Username</label>
              <p>{{ user.username }}</p>
            </div>
            <div class="info-item">
              <label>Birthday</label>
              <p *ngIf="!editing">{{ user.birthday | date: 'longDate' }}</p>
              <p-calendar 
                *ngIf="editing" 
                [(ngModel)]="editedUser.birthday" 
                dateFormat="dd/mm/yy"
                [showIcon]="true"
              ></p-calendar>
            </div>
          </p-panel>
        </div>

        <div class="col-8">
          <p-panel header="Physical Attributes" class="mb-4">
            <div class="grid">
              <div class="col-6">
                <div class="info-item">
                  <label>Height (cm)</label>
                  <p *ngIf="!editing">{{ user.height || 'Not specified' }}</p>
                  <input 
                    *ngIf="editing"
                    type="text" 
                    pInputText 
                    [(ngModel)]="editedUser.height"
                    placeholder="Enter height"
                  >
                </div>
              </div>
              <div class="col-6">
                <div class="info-item">
                  <label>Weight (kg)</label>
                  <p *ngIf="!editing">{{ user.weight || 'Not specified' }}</p>
                  <input 
                    *ngIf="editing"
                    type="text" 
                    pInputText 
                    [(ngModel)]="editedUser.weight"
                    placeholder="Enter weight"
                  >
                </div>
              </div>
            </div>
          </p-panel>

          <p-panel header="Account Details">
            <div class="info-item">
              <label>Member Since</label>
              <p>{{ user.createdAt | date: 'MMM yyyy' }}</p>
            </div>
            <div class="info-item">
              <label>Last Updated</label>
              <p>{{ user.updatedAt | date: 'medium' }}</p>
            </div>
          </p-panel>
        </div>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="footer-actions">
        <button 
          *ngIf="!editing"
          pButton 
          icon="pi pi-pencil" 
          label="Edit Profile" 
          class="p-button-outlined"
          (click)="enterEditMode()"
        ></button>
        
        <div *ngIf="editing" class="edit-buttons">
          <button 
            pButton 
            icon="pi pi-save" 
            label="Save Changes" 
            class="p-button-success"
            (click)="saveChanges()"
          ></button>
          <button 
            pButton 
            icon="pi pi-times" 
            label="Cancel" 
            class="p-button-outlined p-button-danger"
            (click)="cancelEdit()"
          ></button>
        </div>
      </div>
    </ng-template>
  </p-card>
</div>
